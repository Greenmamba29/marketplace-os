name: Deploy Marketplace OS

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run Backend Tests
        run: |
          # Test all backends
          for dir in apps/*/backend; do
            if [ -d "$dir" ]; then
              echo "Testing $dir..."
              cd "$dir" && pytest || true
              cd -
            fi
          done

  build-frontends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [hub, mrodirect, cheemos, buildsource, medsupplyos, voltsource, lithiumbuy, foodops, packsource, agroops, labsource, rigsource, careops, govsource, surplusos, netsource, securesource, uniformos, workspaceos, ingredientos, barrelhub]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install & Build
        run: |
          # Handle nested frontend paths (e.g., apps/cheemos/frontend vs apps/hub)
          if [ -d "apps/${{ matrix.app }}/frontend" ]; then
            cd "apps/${{ matrix.app }}/frontend"
          else
            cd "apps/${{ matrix.app }}"
          fi
          npm install
          npm run build

  deploy:
    needs: [test, build-frontends]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Railway
        run: echo "Deploying backends to Railway..."
      - name: Deploy to Netlify
        run: echo "Deploying frontends to Netlify..."
