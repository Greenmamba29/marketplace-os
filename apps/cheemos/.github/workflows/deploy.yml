name: ChemOS CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/cheemos/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/cheemos/**'

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/cheemos-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/cheemos-frontend

jobs:
  # ---------------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cheemos/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key"
          BASEROW_TOKEN: "test"
          STRIPE_SECRET_KEY: "sk_test_xxx"

  # ---------------------------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cheemos/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/cheemos/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "https://api.cheemos.io"

  # ---------------------------------------------------------------------------
  build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: apps/cheemos/backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest,${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: apps/cheemos/frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest,${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

  # ---------------------------------------------------------------------------
  migrate-neon:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r apps/cheemos/backend/requirements.txt
        working-directory: .

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: apps/cheemos/backend
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  # ---------------------------------------------------------------------------
  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: migrate-neon
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/cheemos
            docker compose pull backend frontend
            docker compose up -d --force-recreate backend frontend celery
            docker system prune -f
