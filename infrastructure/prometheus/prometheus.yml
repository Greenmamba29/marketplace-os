global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'marketplace-frontends'
    static_configs:
      - targets:
        - 'host.docker.internal:3001'
        - 'host.docker.internal:3002'
        - 'host.docker.internal:3003'
        - 'host.docker.internal:3004'
        - 'host.docker.internal:3005'
        - 'host.docker.internal:3006'
        - 'host.docker.internal:3007'
        - 'host.docker.internal:3008'
        - 'host.docker.internal:3009'
        - 'host.docker.internal:3010'
        - 'host.docker.internal:3011'
        - 'host.docker.internal:3012'
        - 'host.docker.internal:3013'
        - 'host.docker.internal:3014'
        - 'host.docker.internal:3015'
        - 'host.docker.internal:3016'
        - 'host.docker.internal:3017'
        - 'host.docker.internal:3018'
        - 'host.docker.internal:3019'
        - 'host.docker.internal:3020'
